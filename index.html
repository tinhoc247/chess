<title>Đấu Trường Cờ Vua</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tournament-hall board with a brass accent. Menu is a two-column hero, game is board + side panel. */
:root {
  --bg: #e8eded;
  --surface: #f7f9f9;
  --ink: #152124;
  --muted: #566a6e;
  --line: #cbd6d7;
  --accent: #c58b2b;
  --on-accent: #1c1405;
  --sq-l: #d5dfdb;
  --sq-d: #5d8582;
  --hl-last: rgba(214, 160, 52, .42);
  --hl-sel: rgba(214, 160, 52, .78);
  --tgt: rgba(21, 33, 36, .3);
  --chk: rgba(204, 66, 46, .9);
  --clock-bg: #dbe5e5;
  --danger: #b73a28;
  --pw-f: #f8f7f1; --pw-s: #1a2326; --pw-d: #1a2326;
  --pb-f: #2b373b; --pb-s: #0a0f11; --pb-d: #aebfc3;
  --f-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1517; --surface: #162023; --ink: #e3ebe9; --muted: #8ea2a6; --line: #28373b;
    --accent: #dfae52; --on-accent: #1b1304;
    --sq-l: #a9bfba; --sq-d: #46706d;
    --hl-last: rgba(223, 174, 82, .42); --hl-sel: rgba(223, 174, 82, .8); --tgt: rgba(10, 16, 18, .38);
    --clock-bg: #0b1113; --danger: #e0715f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1517; --surface: #162023; --ink: #e3ebe9; --muted: #8ea2a6; --line: #28373b;
  --accent: #dfae52; --on-accent: #1b1304;
  --sq-l: #a9bfba; --sq-d: #46706d;
  --hl-last: rgba(223, 174, 82, .42); --hl-sel: rgba(223, 174, 82, .8); --tgt: rgba(10, 16, 18, .38);
  --clock-bg: #0b1113; --danger: #e0715f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.eyebrow { font: 600 12px/1.3 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

/* pieces */
.pc { fill: var(--pf); stroke: var(--ps); stroke-width: 3; stroke-linejoin: round; display: block; }
.pc.w { --pf: var(--pw-f); --ps: var(--pw-s); --pd: var(--pw-d); }
.pc.b { --pf: var(--pb-f); --ps: var(--pb-s); --pd: var(--pb-d); filter: drop-shadow(0 0 .6px rgba(255, 255, 255, .55)); }
.ghost { position: fixed; z-index: 60; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .35)); }

/* board */
.board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden; user-select: none; -webkit-user-select: none; box-shadow: 0 0 0 1px var(--line), 0 10px 28px -14px rgba(10, 25, 28, .5); }
.board.live { touch-action: none; cursor: pointer; }
.sq { position: relative; display: grid; place-items: center; min-width: 0; }
.sq.l { background: var(--sq-l); }
.sq.d { background: var(--sq-d); }
.sq::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: var(--hl-last); }
.sq.sel::before { background: var(--hl-sel); }
.sq.chk::before { background: radial-gradient(circle at 50% 50%, var(--chk) 0, var(--chk) 28%, transparent 72%); }
.sq .pc { position: relative; z-index: 1; width: 90%; height: 90%; }
.sq .pc.lift { opacity: .3; }
.sq.tg::after { content: ""; position: absolute; width: 26%; aspect-ratio: 1; border-radius: 50%; background: var(--tgt); z-index: 2; pointer-events: none; }
.sq.tg.cp::after { width: 88%; background: transparent; border: max(4px, .7vw) solid var(--tgt); }
.co { position: absolute; z-index: 0; font: 600 clamp(9px, 1.5vw, 12px)/1 var(--f-body); pointer-events: none; }
.co.cr { left: 4%; top: 4%; }
.co.cf { right: 5%; bottom: 3%; }
.sq.l .co { color: var(--sq-d); }
.sq.d .co { color: var(--sq-l); }

/* buttons and controls */
.btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.big { padding: 14px 22px; font-size: 16px; width: 100%; }
button:focus-visible, input:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: grid; gap: 8px; }
.field label { font-weight: 600; font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 20px; max-width: 560px; }
.panel.center { text-align: center; justify-items: center; }
.ph { font-size: clamp(24px, 4vw, 32px); font-weight: 800; margin: 6px 0 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tag { font: 600 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--f-body); }
.tag.soft { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.back { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--muted); font-weight: 500; }
.back:hover { color: var(--ink); }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.note.warn { border-color: var(--accent); }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 4px 0 16px; }
.tab { border: 0; background: none; padding: 8px 16px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.nmin { font: 500 16px/1.2 var(--f-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; max-width: 280px; }
.codein { font: 700 28px/1 var(--f-mono); letter-spacing: .25em; text-transform: uppercase; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; max-width: 280px; }
.bigcode { font: 700 clamp(36px, 9vw, 56px)/1 var(--f-mono); letter-spacing: .22em; padding: 16px 12px 16px 24px; border-radius: 12px; background: var(--clock-bg); user-select: all; }
.wait { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.wait i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.55); opacity: .5; } }

/* menu */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: center; padding-top: 6px; }
.hero-txt { display: grid; gap: 14px; }
.hero h1 { font-size: clamp(36px, 8vw, 62px); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; }
.lead { font-size: 17px; color: var(--muted); max-width: 46ch; }
.hero-board { width: min(100%, 420px); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; max-width: 560px; }
.choices.one { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
.choice { text-align: left; padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; gap: 4px; }
.choice b { font: 700 22px/1.2 var(--f-display); }
.choice span { color: var(--muted); font-size: 14px; }
.choice:hover { border-color: var(--accent); }
@media (min-width: 820px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, 420px); gap: 48px; } }

/* game */
.gamehead { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .game { grid-template-columns: minmax(0, 640px) minmax(280px, 1fr); align-items: start; } }
.stage { display: grid; gap: 10px; min-width: 0; }
.board-wrap { position: relative; }
.strip { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.strip.act { border-color: var(--accent); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--sq-d); flex: none; }
.avatar .pc { width: 78%; height: 78%; }
.who { flex: 1; min-width: 0; display: grid; }
.who b { font: 700 16px/1.2 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-name { font-size: 12px; color: var(--muted); }
.cap { display: flex; align-items: center; flex-wrap: wrap; min-height: 18px; padding-right: 6px; }
.cap .pc { width: 17px; height: 17px; margin-right: -5px; }
.cap em { font: 600 12px/1 var(--f-mono); font-style: normal; color: var(--muted); margin-left: 10px; }
.clock { display: grid; justify-items: end; gap: 2px; min-width: 118px; padding: 6px 12px; border-radius: 10px; background: var(--clock-bg); text-align: right; }
.clock .t { font: 700 clamp(22px, 5.4vw, 30px)/1.05 var(--f-mono); font-variant-numeric: tabular-nums; }
.clock .s { font: 500 11px/1.2 var(--f-mono); color: var(--muted); white-space: nowrap; }
.clock.up::before { content: "Tổng thời gian"; font: 500 10px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.clock.on { background: var(--accent); color: var(--on-accent); }
.clock.on .s { color: var(--on-accent); opacity: .8; }
.clock.low:not(.on) .t { color: var(--danger); }
.clock.low.on .t { color: #7a1608; }
.side { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.card h2 { font-size: 15px; font-weight: 700; }
.stat-line { font: 700 18px/1.3 var(--f-display); }
.stat-line.think::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
.moves { display: grid; grid-template-columns: 34px 1fr 1fr; align-content: start; max-height: 260px; overflow-y: auto; font: 500 14px/1.9 var(--f-mono); }
.mn { color: var(--muted); }
.mv { padding: 0 6px; border-radius: 4px; }
.mv.cur { background: var(--hl-last); }
.empty { grid-column: 1 / -1; color: var(--muted); font-family: var(--f-body); font-size: 14px; }
.ctl { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.ov { position: absolute; inset: 0; background: rgba(8, 16, 18, .62); display: grid; place-items: center; padding: 16px; z-index: 20; border-radius: 6px; }
.ovc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; text-align: center; justify-items: center; max-width: 360px; width: 100%; }
.ovc h3 { font-size: 30px; font-weight: 800; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.pbtn { border: 1px solid var(--line); background: var(--sq-l); border-radius: 10px; padding: 8px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #152124; }
.pbtn:hover { border-color: var(--accent); }
.pbtn .pc { width: 100%; max-width: 54px; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 520px) {
  .clock { min-width: 100px; padding: 5px 9px; }
  .avatar { width: 30px; height: 30px; }
  .strip { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .wait i, .stat-line.think::after { animation: none; } .toast { transition: none; } }

/* ===== v3: một màn hình, chọn chế độ bằng ô tích, hướng dẫn dạng hover ===== */
:root { --chrome: 172px; --chrome-m: 392px; }
body { padding-block: 10px; }
.wrap { max-width: 1280px; min-height: calc(100dvh - 20px); display: flex; flex-direction: column; justify-content: center; }

/* tooltip */
.tip { position: relative; display: inline-grid; place-items: center; width: 18px; height: 18px; padding: 0; margin-left: 6px; border-radius: 50%; border: 1px solid var(--muted); background: transparent; color: var(--muted); font: 700 11px/1 var(--f-body); font-style: normal; cursor: help; vertical-align: middle; text-transform: none; letter-spacing: 0; }
.tip::after { content: attr(data-tip); position: absolute; left: -8px; bottom: calc(100% + 8px); width: max-content; max-width: min(260px, 72vw); padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font: 500 12.5px/1.45 var(--f-body); text-align: left; white-space: normal; display: none; pointer-events: none; z-index: 70; }
.tip.c::after { left: 50%; transform: translateX(-50%); }
.tip:hover, .tip:focus-visible { color: var(--ink); border-color: var(--ink); }
.tip.r::after { left: auto; right: -8px; }
.tip:hover::after, .tip:focus::after { display: block; }
body { overflow-x: hidden; }

/* menu */
.menu { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: center; }
.menu-main { display: grid; gap: 14px; max-width: 480px; width: 100%; margin-inline: auto; }
.menu h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
.menu .hero-board { display: none; }
@media (min-width: 820px) {
  .menu { grid-template-columns: minmax(0, 480px) auto; justify-content: center; gap: 44px; }
  .menu .hero-board { display: block; width: min(420px, calc(100dvh - 60px)); }
  .menu-main { margin-inline: 0; }
}
.menu.one { justify-items: center; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { position: relative; display: block; cursor: pointer; }
.mode input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.mc { display: grid; grid-template-columns: 22px 1fr; column-gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.mc b { font: 700 18px/1.2 var(--f-display); }
.mc small { grid-column: 2; color: var(--muted); font-size: 13px; line-height: 1.3; }
.tk { grid-row: 1 / span 2; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; font: 800 13px/1 var(--f-body); color: transparent; }
.mode input:checked + .mc { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mode input:checked + .mc .tk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mode input:focus-visible + .mc { outline: 2px solid var(--accent); outline-offset: 2px; }
.menu .panel { max-width: none; padding: 16px; gap: 14px; }
.menu .field { gap: 6px; }
.menu .chip { padding: 7px 13px; font-size: 13.5px; }
.board { grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); }
.sq { min-height: 0; overflow: hidden; }
.gamehead { justify-content: center; }
.box { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.boxh { display: flex; align-items: center; font: 700 15px/1.2 var(--f-display); }
.inrow { display: flex; gap: 8px; align-items: stretch; }
.inrow .codein { flex: 1; min-width: 0; max-width: none; font-size: 22px; padding: 9px 12px; }
.inrow .btn { white-space: nowrap; }
.menu .nmin { max-width: none; padding: 8px 12px; }
.menu .btn.big { padding: 12px 18px; }
.menu .bigcode { font-size: clamp(34px, 9vw, 52px); padding: 12px 10px 12px 22px; }
.menu .panel.center { gap: 14px; }

/* game: vừa một màn hình */
.gamehead { margin-bottom: 6px; align-items: center; gap: 6px; min-height: 26px; }
.gamehead .tip { margin-left: 0; }
.game { gap: 12px; }
.stage { gap: 6px; width: min(100%, calc(100dvh - var(--chrome-m))); margin-inline: auto; }
.strip { padding: 4px 8px; gap: 8px; border-radius: 10px; min-height: 48px; }
.avatar { width: 28px; height: 28px; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; }
.who b { font-size: 15px; }
.side-name { font-size: 12px; }
.cap { min-height: 0; flex-basis: 100%; }
.cap .pc { width: 14px; height: 14px; margin-right: -4px; }
.cap:empty { display: none; }
.clock { min-width: 84px; padding: 3px 9px; gap: 0; }
.clock .t { font-size: 20px; }
.clock .s { font-size: 10px; }
.clock.up::before { content: none; }
.side { gap: 8px; }
.side .card { padding: 10px 12px; gap: 6px; }
.stat-line { font-size: 16px; }
.moves { max-height: 62px; line-height: 1.7; font-size: 13px; }
.ctl { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ctl .btn { padding: 8px 4px; font-size: 13px; }
@media (min-width: 900px) {
  .stage { width: min(calc(100vw - 440px), calc(100dvh - var(--chrome))); margin-inline: 0; }

        if (first) { first = false; clearTimeout(timer); resolve(ch); } else emit();

  function leaveOnline() {
    if (!ON) return;
    ON.unsub.forEach(function (u) { try { u(); } catch (e) { } });
    leaveCh(ON.ch);
    ON = null;
  }
  function safeBase(v) { v = +v; return BASES.indexOf(v) >= 0 ? v : 10; }
  function safeInc(v) { v = +v; return INCS.indexOf(v) >= 0 ? v : 0; }

  async function onlineCreate() {
    if (!roomApi || M.busy) return;
    M.busy = true; M.err = ''; renderMenu(); saveSettings();
    var col = M.color === 'r' ? (Math.random() < 0.5 ? 1 : -1) : (M.color === 'w' ? 1 : -1);
    try {
      await fbInit();
      for (var attempt = 0; attempt < 3; attempt++) {
        var code = genCode(), ch = await openChannel(code);
        if (playersIn(ch, code).length) { leaveCh(ch); continue; }
        ON = { ch: ch, code: code, role: 'host', unsub: [], cfg: { col: col, base: M.base, inc: M.inc } };
        await ch.presence({ g: code, role: 'host', col: col, base: M.base, inc: M.inc, moves: '', gn: 1, nm: myName() });
        ON.unsub.push(ch.onPeers(onlineSync));
        M.step = 'waiting'; M.wait = { code: code, col: col, base: M.base }; M.busy = false; renderMenu();
        return;
      }
      M.err = 'Không tạo được phòng, hãy thử lại.';
    } catch (e) {
      leaveOnline();
      M.err = fbErrText(e);
    }
    M.busy = false; renderMenu();
  }

  // Vào phòng theo mã. Trả về '' nếu thành công, hoặc câu báo lỗi.
  async function joinRoom(code) {
    var ch = await openChannel(code);
    var pl = playersIn(ch, code);
    if (!pl.length) { leaveCh(ch); return 'Không tìm thấy phòng ' + code + '. Hãy chắc chắn bạn bè đã tạo phòng và vẫn mở trang.'; }
    if (pl.length > 1) { leaveCh(ch); return 'Phòng ' + code + ' đã đủ 2 người chơi.'; }
    var o = pl[0].presence, col = o.col === 1 ? -1 : 1, role = o.role === 'host' ? 'guest' : 'host';
    var base = safeBase(o.base), inc = safeInc(o.inc);
    ON = { ch: ch, code: code, role: role, unsub: [], cfg: { col: col, base: base, inc: inc } };
    await ch.presence({ g: code, role: role, col: col, base: base, inc: inc, moves: '', gn: (+o.gn || 1), nm: myName() });
    ON.unsub.push(ch.onPeers(onlineSync));
    if (MM) mmStop(true);
    startOnlineGame(col, base, inc, o);
    return '';
  }
  async function onlineJoin() {
    if (!roomApi || M.busy) return;
    var code = (M.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { M.err = 'Nhập mã phòng gồm 5 ký tự.'; renderMenu(); return; }
    M.busy = true; M.err = ''; renderMenu();
    try {
      await fbInit();
      M.err = await joinRoom(code);
    } catch (e) {
      leaveOnline();
      M.err = fbErrText(e);
    }
    M.busy = false;
    if (!G) renderMenu();
  }

  // ---------------------------------------------------------------- ghép ngẫu nhiên
  // Mọi người đang tìm trận ghi {t: giờ server} vào live/mm-{phút}-{cộng giờ}/{uid} và gia hạn mỗi 4 giây.
  // Người có uid nhỏ nhất trong nhóm chưa được mời sẽ tạo phòng rồi "mời" người chờ lâu nhất (inv + room);
  // người được mời thấy lời mời thì vào phòng đó. Mời không được nhận sau 12 giây thì huỷ và thử lại.
  var MM_FRESH = 15000, MM_INVITE_MS = 12000;
  async function mmStart() {
    if (!roomApi || M.busy || MM) return;
    M.busy = true; M.err = ''; renderMenu(); saveSettings();
    try {
      await fbInit();
      var qcode = 'mm-3-0';
      var qref = FB.db.ref('live/' + qcode), meRef = qref.child(FB.uid), connRef = FB.db.ref('.info/connected');
      var m = { qcode: qcode, qref: qref, meRef: meRef, connRef: connRef, base: 3, inc: 0, peers: {}, hosting: null, joining: false, skipRoom: {}, skipUid: {}, dead: false };
      var ts = firebase.database.ServerValue.TIMESTAMP;
      meRef.onDisconnect().remove();
      await meRef.set({ t: ts });
      m.vh = qref.on('value', function (sn) { m.err = ''; m.peers = sn.val() || {}; mmUi(); mmTick(); }, function (e) { m.err = fbErrText(e); mmUi(); });
      m.chh = connRef.on('value', function (sn) { if (sn.val() === true && !m.dead) { meRef.onDisconnect().remove(); meRef.update({ t: ts }).catch(noop); } });
      m.hb = setInterval(function () { meRef.update({ t: ts }).catch(noop); }, 4000);
      m.tk = setInterval(mmTick, 2000);
      MM = m;
      M.step = 'searching'; M.busy = false; renderMenu();
    } catch (e) {
      M.err = fbErrText(e); M.busy = false; renderMenu();
    }
  }
  function mmStop(keepOn) {
    var m = MM;
    if (!m) return;
    MM = null; m.dead = true;
    clearInterval(m.hb); clearInterval(m.tk);
    if (m.hosting) clearTimeout(m.hosting.timer);
    try {
      m.qref.off('value', m.vh); m.connRef.off('value', m.chh);
      m.meRef.onDisconnect().cancel(); m.meRef.remove().catch(noop);
    } catch (e) { }
    if (!keepOn) leaveOnline();
  }

  // ---------------------------------------------------------------- trạng thái hàng chờ + số người online
  // Mỗi trang đang mở ghi 1 mục live/on-{uid} = {t}, tự xoá khi thoát; ai im quá 15 giây thì không tính.
  var PR = {}, PE = '';
  function mmUi() {
    var m = MM, el = document.getElementById('mmst');
    if (!m || !el) return;
    var now = Date.now() + FB.offset, n = 0;
    for (var k in m.peers) if (mmFresh(m.peers[k], now)) n++;
    el.textContent = m.err ? m.err : 'Hàng chờ (3 phút/bên): ' + n + ' người';
    el.style.color = m.err ? 'var(--accent)' : 'var(--muted)';
  }
  function onlUi() {
    var els = document.querySelectorAll('.onl');
    if (!els.length) return;
    var t;
    if (PE) t = PE;
    else {
      var now = Date.now() + FB.offset, n = 0;
      for (var k in PR) { var x = PR[k]; if (x && typeof x.t === 'number' && now - x.t < MM_FRESH) n++; }
      t = '🟢 Đang online: ' + Math.max(n, 1) + ' người';
    }
    for (var i = 0; i < els.length; i++) { els[i].textContent = t; els[i].style.color = PE ? 'var(--accent)' : 'var(--muted)'; }
  }
  function presInit() {
    fbInit().then(function () {
      var r = FB.db.ref('live/on-chess'), me = r.child(FB.uid), conn = FB.db.ref('.info/connected'), ts = firebase.database.ServerValue.TIMESTAMP;
      conn.on('value', function (q) { if (q.val() === true) { me.onDisconnect().remove(); me.set({ t: ts }).catch(noop); } });
      setInterval(function () { me.update({ t: ts }).catch(noop); }, 5000);
      setInterval(function () { onlUi(); mmUi(); }, 3000);
      r.on('value', function (q) { PR = q.val() || {}; PE = ''; onlUi(); }, function (e) { PE = fbErrText(e); onlUi(); });
    }).catch(noop);
  }
  var _renderMenu = renderMenu;
  renderMenu = function () { _renderMenu(); onlUi(); mmUi(); };
  presInit();
  function mmFresh(p, now) { return p && typeof p.t === 'number' && now - p.t < MM_FRESH; }
  function mmTick() {
    var m = MM;
    if (!m || m.dead || m.joining || m.hosting || G) return;
    var now = Date.now() + FB.offset, me = FB.uid, P = m.peers, k;
    // 1) có người mời mình vào phòng
    for (k in P) {
      if (k !== me && mmFresh(P[k], now) && P[k].inv === me && P[k].room && !m.skipRoom[P[k].room]) { mmJoin(P[k].room); return; }
    }
    // 2) mình là người nhỏ nhất trong nhóm chưa được mời: tạo phòng và mời người chờ lâu nhất
    var pool = Object.keys(P).filter(function (x) {
      return mmFresh(P[x], now) && !P[x].inv && !(x !== me && m.skipUid[x] > Date.now());
    }).sort();
    if (pool.length >= 2 && pool[0] === me) {
      var target = pool.slice(1).sort(function (a, b) { return (P[a].t - P[b].t) || (a < b ? -1 : 1); })[0];
      mmHost(target);
    }
  }
  async function mmHost(target) {
    var m = MM;
    m.hosting = { target: target, timer: 0 };
    var col = Math.random() < 0.5 ? 1 : -1;
    try {
      var code, ch = null;
      for (var attempt = 0; attempt < 3 && !ch; attempt++) {
        code = genCode(); ch = await openChannel(code);
        if (playersIn(ch, code).length) { leaveCh(ch); ch = null; }
      }
      if (!ch) throw new Error('code');
      if (m.dead) { leaveCh(ch); return; }
      ON = { ch: ch, code: code, role: 'host', unsub: [], cfg: { col: col, base: m.base, inc: m.inc } };
      await ch.presence({ g: code, role: 'host', col: col, base: m.base, inc: m.inc, moves: '', gn: 1, nm: myName() });
      ON.unsub.push(ch.onPeers(onlineSync));
      await m.meRef.update({ inv: target, room: code });
      if (m.dead) return;
      m.hosting.timer = setTimeout(function () { mmUnhost(target); }, MM_INVITE_MS);
    } catch (e) {
      if (MM) { MM.err = fbErrText(e); mmUi(); }
      mmUnhost(target);
    }
  }
  function mmUnhost(target) {
    var m = MM;
    if (!m || !m.hosting) return;
    clearTimeout(m.hosting.timer);
    m.hosting = null;
    m.skipUid[target] = Date.now() + 20000;
    leaveOnline();
    m.meRef.update({ inv: null, room: null }).catch(noop);
  }
  async function mmJoin(code) {
    var m = MM;
    m.joining = true;
    var err = 'x';
    try { err = await joinRoom(code); } catch (e) { leaveOnline(); err = fbErrText(e); }
    if (err && MM === m) { m.skipRoom[code] = true; m.joining = false; if (typeof err === 'string' && err !== 'x') { m.err = err; mmUi(); } }
  }

  function startOnlineGame(col, base, inc, resume) {
    newGame({ kind: 'online', myColor: col, base: base, inc: inc, code: ON.code, gn: (resume && +resume.gn) || 1 });
    if (resume) adoptMoves(resume, true);
    onlineSync();
  }

  // Ván mới trong cùng phòng: đổi màu quân, tăng số ván (gn), xoá nước đi cũ trong presence.
  function nextOnlineGame() {
    var gn = G.gn + 1, col = -G.myColor, cfg = { kind: 'online', myColor: col, base: G.cfg.base, inc: G.cfg.inc, code: G.code, gn: gn };
    newGame(cfg);
    publishOnline({ moves: '', clk: null, res: null, dr: null, da: null, dn: null, rm: null, col: col });
  }

  function adoptMoves(pr, all) {
    var theirs = String(pr.moves || '').split(' ').filter(Boolean);
    var mine = G.hist.map(function (h) { return Z.uci(h.m); });
    if (theirs.length <= mine.length) return;
    for (var i = 0; i < mine.length; i++) if (mine[i] !== theirs[i]) return;
    for (var j = mine.length; j < theirs.length; j++) {
      var m = Z.findMove(G.pos, theirs[j]);
      if (!m) break;
      var last = j === theirs.length - 1;
      applyMove(m, { remote: true, clk: last ? pr.clk : null, all: all });
      if (G.result) break;
    }
  }

  function publishOnline(extra) {
    if (!ON || !G) return;
    var patch = {
      gn: G.gn, nm: myName(),
      moves: G.hist.map(function (h) { return Z.uci(h.m); }).join(' '),
      clk: [Math.round(G.left['1']), Math.round(G.left['-1']), Math.round(G.used['1']), Math.round(G.used['-1'])]
    };
    if (extra) for (var k in extra) patch[k] = extra[k];
    try { ON.ch.presence(patch).catch(function () { }); } catch (e) { }
  }

  function onlineSync() {
    if (!ON) return;
    var opp = playersIn(ON.ch, ON.code)[0];
    if (!G) {
      if ((M.step === 'waiting' || M.step === 'searching') && opp && opp.presence.role === 'guest') {
        if (MM) mmStop(true);
        M.step = 'root';
        startOnlineGame(ON.cfg.col, ON.cfg.base, ON.cfg.inc, null);
      }
      return;
    }
    if (G.kind !== 'online') return;
    var present = !!opp;
    if (present !== G.oppPresent) { G.oppPresent = present; renderSide(); }
    if (!opp) return;
    var pr = opp.presence, og = +pr.gn || 1;
    var nm = String(pr.nm || '').slice(0, 16);
    if (nm !== G.oppName) { G.oppName = nm; render(); }
    var oppWants = og === G.gn && +pr.rm === G.gn;
    if (G.result && G.wantRematch && (oppWants || og === G.gn + 1)) { nextOnlineGame(); return; }
    if (G.result && oppWants !== G.oppWants) { G.oppWants = oppWants; render(); }
    if (og !== G.gn) return;
    if (!G.result) adoptMoves(pr, false);
    if (!G.result && pr.res === 'resign') { end({ type: 'resign', winner: G.myColor, text: 'Đối thủ đã đầu hàng. Bạn thắng!' }); return; }
    if (!G.result && pr.dr && pr.dr !== G.seenDr) { G.seenDr = pr.dr; G.incoming = pr.dr; renderSide(); }
    if (!G.result && G.myOffer && pr.da === G.myOffer) { end({ type: 'draw', text: 'Hòa do hai bên đồng ý.' }); return; }
    if (G.myOffer && pr.dn === G.myOffer && G.offerState === 'sent') { G.offerState = 'declined'; renderSide(); toast('Đối thủ từ chối xin hòa'); }
  }

  // ---------------------------------------------------------------- actions
  function startAI() {
    var col = M.color === 'r' ? (Math.random() < 0.5 ? 1 : -1) : (M.color === 'w' ? 1 : -1);
    saveSettings();
    newGame({ kind: 'ai', online: M.online, level: M.level, myColor: col, base: M.base, inc: M.inc });
  }

  function leaveGame() {
    G = null;
    leaveOnline();
    M.step = 'root'; M.err = ''; M.busy = false;
    renderMenu();
  }

  function act(name, el) {
    switch (name) {
      case 'go': M.step = el.dataset.v; M.err = ''; renderMenu(); if (M.step === 'p2p' && roomApi) fbInit().catch(noop); break;
      case 'offline': M.online = false; M.step = 'ai'; renderMenu(); break;
      case 'online-ai': M.online = true; M.step = 'ai'; renderMenu(); break;
      case 'tab': M.tab = el.dataset.v; M.err = ''; renderMenu(); break;
      case 'start-ai': startAI(); break;
      case 'create-room': onlineCreate(); break;
      case 'random-start': mmStart(); break;
      case 'random-cancel': mmStop(false); M.step = 'root'; M.mode = 'duo'; M.err = ''; renderMenu(); break;
      case 'join-room': onlineJoin(); break;
      case 'copy-code':
        try {
          navigator.clipboard.writeText(M.wait.code).then(function () { toast('Đã sao chép mã phòng'); }, function () { toast('Hãy chọn và sao chép mã bằng tay'); });
        } catch (e) { toast('Hãy chọn và sao chép mã bằng tay'); }
        break;
      case 'cancel-room': leaveOnline(); M.step = 'root'; M.mode = 'duo'; M.wait = null; renderMenu(); break;
      case 'flip': G.flip = !G.flip; render(); break;
      case 'undo': doUndo(); break;
      case 'resign':
        if (G.result) break;
        if (!confirmable('resign')) break;
        if (G.kind === 'online') publishOnline({ res: 'resign' });
        end({ type: 'resign', winner: -G.myColor, text: 'Bạn đã đầu hàng. ' + cname(-G.myColor) + ' thắng.' });
        break;
      case 'draw':
        if (G.result || G.kind !== 'online') break;
        G.myOffer = Date.now(); G.offerState = 'sent';
        publishOnline({ dr: G.myOffer });
        renderSide(); toast('Đã gửi lời xin hòa');
        break;
      case 'accept-draw':
        if (!G.incoming) break;
        try { ON.ch.presence({ da: G.incoming }).catch(function () { }); } catch (e) { }
        end({ type: 'draw', text: 'Hòa do hai bên đồng ý.' });
        break;
      case 'decline-draw':
        if (!G.incoming) break;
        try { ON.ch.presence({ dn: G.incoming }).catch(function () { }); } catch (e) { }
        G.incoming = null; renderSide();
        break;
      case 'menu':
        if (!G.result && G.hist.length && !confirmable('menu')) break;
        leaveGame();
        break;
      case 'exit': leaveGame(); break;
      case 'rematch':
        if (G.kind === 'online') {
          if (!G.result || G.wantRematch || !G.oppPresent) break;
          G.wantRematch = true;
          publishOnline({ rm: G.gn });
          render();
          onlineSync();
          break;
        }
        newGame(Object.assign({}, G.cfg));
        break;
      case 'ov-hide': G.overlayHidden = true; render(); break;
      case 'promo': {
        var t = +el.dataset.p, pm = G.promo;
        if (!pm) break;
        var m = pm.moves.filter(function (x) { return ((x >> 12) & 7) === t; })[0];
        G.promo = null;
        if (m != null) applyMove(m); else render();
        break;
      }
      case 'promo-cancel': G.promo = null; G.sel = null; G.targets = new Map(); render(); break;
    }
  }

  screen.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-set]');
    if (!el || el.disabled) return;
    if (el.dataset.set) {
      var kv = el.dataset.set.split(':'), k = kv[0], v = kv[1];
      if (k === 'base' || k === 'inc') v = +v;
      M[k] = v;
      if (k === 'base' && !v) M.inc = 0;
      if (k === 'mode') { M.err = ''; if (v === 'duo' && roomApi) fbInit().catch(noop); }
      renderMenu();
      return;
    }
    act(el.dataset.act, el);
  });
  screen.addEventListener('input', function (e) {
    if (e.target.id === 'pname') { M.name = e.target.value.slice(0, 16); saveSettings(); return; }
    if (e.target.id === 'code') {
      M.code = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
      e.target.value = M.code;
    }
  });
  screen.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'code') onlineJoin();
  });

  // ---------------------------------------------------------------- board input (click, tap and drag)
  screen.addEventListener('pointerdown', function (e) {
    if (e.button > 0 || !G) return;
    var sqEl = e.target.closest ? e.target.closest('.sq') : null;
    if (!sqEl || !sqEl.closest('.board.live')) return;
    if (!canMove()) return;
    var s = +sqEl.dataset.sq, p = G.pos.b[s];
    if (G.sel != null && G.targets.has(s)) { e.preventDefault(); tryMove(G.sel, s); return; }
    if (p * G.myColor > 0) {
      e.preventDefault();
      var was = G.sel === s;
      selectSq(s);
      drag = { s: s, x: e.clientX, y: e.clientY, on: false, was: was, ghost: null, half: 0 };
      try { document.body.setPointerCapture(e.pointerId); } catch (x) { }
      document.addEventListener('pointermove', onDragMove);
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    } else if (G.sel != null) {
      clearSel();
    }
  });
  function startDrag() {
    var src = $('.sq[data-sq="' + drag.s + '"] .pc');
    if (!src) { stopDrag(); return; }
    var r = src.getBoundingClientRect(), g = src.cloneNode(true);
    g.classList.add('ghost');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g);
    src.classList.add('lift');
    drag.on = true; drag.ghost = g; drag.half = r.width / 2;
  }
  function onDragMove(e) {
    if (!drag) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      startDrag();
      if (!drag) return;
    }
    drag.ghost.style.left = (e.clientX - drag.half) + 'px';
    drag.ghost.style.top = (e.clientY - drag.half) + 'px';
  }
  function stopDrag() {
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);
    if (drag && drag.ghost) drag.ghost.remove();
    drag = null;
  }
  function onDragEnd(e) {
    var d = drag;
    stopDrag();
    if (!d || !G) return;
    if (d.on) {
      var el = document.elementFromPoint(e.clientX, e.clientY), sqEl = el && el.closest ? el.closest('.sq') : null;
      var s2 = sqEl ? +sqEl.dataset.sq : -1;
      if (e.type !== 'pointercancel' && s2 >= 0 && G.targets.has(s2)) tryMove(d.s, s2);
      else renderBoard();
    } else if (d.was) {
      clearSel();
    }
  }

  // ---------------------------------------------------------------- boot
  roomApi = fbConfigured();

  renderMenu();
})();

</script>

<script id="vk-js">
(function(){var T=null,OKA='',sh=true,K=null,R=['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM'],NM={jN:1,pname:1,nm:1,hwn:1};
function el(){return T?document.getElementById(T):null}
function isNm(){return !!NM[T]}
function build(){K=document.createElement('div');K.id='vk';K.addEventListener('mousedown',function(e){e.preventDefault()});
 K.addEventListener('click',function(e){var b=e.target.closest('button');if(b)key(b.getAttribute('data-k'))});document.body.appendChild(K)}
function draw(){var n=isNm(),lc=function(c){return /[A-Z]/.test(c)&&n&&!sh?c.toLowerCase():c};
 K.innerHTML=R.map(function(r,i){return '<div class="vr">'+(i==3&&n?'<button class="fn'+(sh?' on':'')+'" data-k="SH">⇧</button>':'')+r.split('').map(function(c){return '<button'+(i==0?' class="num"':'')+' data-k="'+lc(c)+'">'+lc(c)+'</button>'}).join('')+(i==3?'<button class="fn" data-k="BS">⌫</button>':'')+'</div>'}).join('')+
 '<div class="vr"><button class="cl" data-k="CL">✖ Đóng</button>'+(n?'<button class="sp" data-k=" ">␣ Dấu cách</button>':'')+'<button class="ok" data-k="OK">✔ Xong</button></div>'}
